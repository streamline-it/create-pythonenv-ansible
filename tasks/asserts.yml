---
- name: ensure needed variables exist
  ansible.builtin.assert:
    that: 
      - create_pythonenv_ansible_parent_directory is defined
      - create_pythonenv_ansible_parent_directory is truthy
      - create_pythonenv_ansible_versions is defined
      - create_pythonenv_ansible_versions is truthy
      - create_pythonenv_ansible_user_home_directory is defined
      - create_pythonenv_ansible_user_home_directory is truthy
      - create_pythonenv_ansible_user is defined
      - create_pythonenv_ansible_user is truthy
    fail_msg: >
      "Make sure the following variables exist and are defined"
